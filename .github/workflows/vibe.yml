name: Vibe Coding

# 管理画面からの指示でコードを変更し、ゲートを通ったときだけ push する。
# push されると Vercel が自動デプロイし、公開サイトが更新される。
#
# ══════════════════════════════════════════════════════════════════════════
# ⚠️ ジョブを3つに分けている理由（SEC-084 / SEC-085）— 変更する前に必ず読むこと
# ══════════════════════════════════════════════════════════════════════════
# 以前は 1 ジョブで「エージェント実行 → 検査 → ゲート → push」を順に行っていた。
# 監査（docs/security-vibe-audit-2026-07-31.md）で **Critical 2 件**が確認された:
#
#  SEC-084: 検査が一度も発火しなかった。`git diff <base>..HEAD` は**コミット間**の比較だが、
#           検査の時点で変更は未コミット（commit は最後）。つまり常に空だった。
#  SEC-085: `pnpm test:unit` と `pnpm build` は**エージェントが書いたコードを実行する**。
#           同じジョブの `.git/config` には checkout が置いた `contents: write` の
#           資格情報があり、実行されたコードから読めた。公開リポジトリなので、
#           それをソースに書けば第三者に永久公開されうる（SEC-086）。
#           **「防御をゲート自身が無効化する」構造**（SEC-075 と同型）の再発だった。
#
# したがって:
#
#   agent   … エージェントを動かし、変更を **patch として持ち出す**だけ。
#             `permissions: contents: read` / `persist-credentials: false`。
#             **ゲートは動かさない**（この時点のワークスペースは汚染されている）。
#   verify  … **クリーンな checkout** に patch を当ててゲートを回す。
#             エージェントのコードが実行されるのはここだが、**資格情報が一切無い**。
#   push    … **クリーンな checkout** に patch を当てて commit & push する。
#             ここでは install も build もしない＝**エージェントのコードを一切実行しない。**
#
# 各ジョブが patch を当てた直後に検査をやり直す。**検査と push を、
# 攻撃者コードが動いたのとは別のプロセス空間に置く**のが要点である。
#
# ── その他の設計の要点 ──────────────────────────────────────
# 1. **ルールに従う側がルールを書き換えられない。**
#    このファイルと scripts/ は許可リストの外なので、エージェントは変更できない。
#    加えて、管理画面が使う PAT には `workflows: write` を与えていないので、
#    GitHub 側でもワークフロー定義の変更を拒否する（二重）。
# 2. **変更可能な範囲は許可リストで決まる**（scripts/vibe-policy.mjs）。
#    拒否リストは知っている危険しか止められない（SEC-087 / 088 / 089）。

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: '変更したい内容（日本語で可）'
        required: true
        type: string

# ⚠️ 既定は read。**書き込みを与えるのは push ジョブだけ**（下でジョブ単位に上書きする）。
permissions:
  contents: read

concurrency:
  # 同時に走らせない。並行実行すると push が競合し、後勝ちで変更が消える。
  group: vibe-coding
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────
  # 1. エージェント: 変更を作り、patch として持ち出す。ゲートは回さない。
  # ────────────────────────────────────────────────────────────────
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      base: ${{ steps.base.outputs.sha }}
      changed: ${{ steps.patch.outputs.changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # ⚠️ **資格情報を .git/config に残さない**（SEC-085 / SEC-086）。
          # これが無いと、この後に動くエージェントとゲートから push トークンが読める。
          persist-credentials: false

      - name: 比較元を記録
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 検査モジュールを base から退避する
        # ⚠️ **判定モジュールを作業ツリーから読んではいけない**（SEC-099）。
        # 3回の検査は「前のジョブを信用しない」ために置いているが、いずれも
        # `scripts/vibe-policy.mjs` を作業ツリーから読んでいた。patch がその判定モジュール
        # 自身を含んでいれば、3つの検査はそろって「許可されている」と答える。
        # base の内容をツリー外へ退避し、**常にそちらを実行する。**
        run: |
          mkdir -p /tmp/vibe-guard
          git show "${{ steps.base.outputs.sha }}:scripts/check-protected-paths.mjs" > /tmp/vibe-guard/check-protected-paths.mjs
          git show "${{ steps.base.outputs.sha }}:scripts/vibe-policy.mjs"           > /tmp/vibe-guard/vibe-policy.mjs

      - uses: pnpm/action-setup@v4
        # version は指定しない。package.json の `packageManager` が真実源であり、
        # 両方に書くと action が「複数指定」で落ちる。

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prisma Client を生成
        # エージェントが型を確認できるようにする。DB へは接続しない。
        run: pnpm exec prisma generate

      - name: エージェントを実行
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          VIBE_INSTRUCTION: ${{ inputs.instruction }}
        run: node scripts/vibe-agent.mjs

      - name: 許可された範囲の変更かを検査
        # ⚠️ `git add -A` を**検査の前に**行う。インデックスと比較しないと
        # 新規ファイル（`scripts/` への追加など）を見逃す（SEC-084）。
        run: |
          git add -A
          node /tmp/vibe-guard/check-protected-paths.mjs "${{ steps.base.outputs.sha }}"

      - name: patch を作る
        id: patch
        run: |
          if git diff --cached --quiet "${{ steps.base.outputs.sha }}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "変更が発生しませんでした。"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff --cached --binary "${{ steps.base.outputs.sha }}" > /tmp/vibe.patch
          wc -c /tmp/vibe.patch

      - uses: actions/upload-artifact@v4
        if: steps.patch.outputs.changed == 'true'
        with:
          name: vibe-patch
          path: /tmp/vibe.patch
          retention-days: 1

  # ────────────────────────────────────────────────────────────────
  # 2. 検証: クリーンな木に patch を当ててゲートを回す。
  #    **エージェントのコードが実行されるのはここだけ。資格情報は無い。**
  # ────────────────────────────────────────────────────────────────
  verify:
    needs: agent
    if: needs.agent.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    # ⚠️ **以下はすべて CI 専用のダミー値であり、本番の値ではない。**
    # `next build` / `next start` は NODE_ENV=production で走るため `lib/env.ts` の本番検証
    #（KV / Turnstile / 秘密鍵の存在と長さ、鍵の用途分離）が発火する。
    # 秘密漏えい検査（check-secret-leak.mjs）は**この値が応答に出ないこと**を見るので、
    # 十分に長く、他と紛れない文字列にしてある。
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      AUTH_SECRET: vibe-ci-dummy-auth-secret-0123456789abcdef
      FORM_SESSION_SECRET: vibe-ci-dummy-form-session-secret-fedcba9876543210
      CRON_SECRET: vibe-ci-dummy-cron-secret-aaaabbbbccccdddd
      TURNSTILE_SECRET: vibe-ci-dummy-turnstile-secret-eeeeffff00001111
      # `https://` の偽ホストは `isKvConfigured()` に「到達可能な KV」と誤認され、
      # 実 DNS 参照を招く（ci.yml で実際に踏んだ）。`memory://` で明示的に無効化する。
      KV_REST_API_URL: memory://local-dev-only
      KV_REST_API_TOKEN: vibe-ci-dummy-kv-token-2222333344445555
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/driving_school?schema=public
      POSTGRES_PRISMA_URL: postgresql://postgres:postgres@localhost:5432/driving_school?schema=public
      POSTGRES_URL_NON_POOLING: postgresql://postgres:postgres@localhost:5432/driving_school?schema=public
      ADMIN_EMAIL: admin@iwataki-driving-school.demo
      ADMIN_NAME: デモ管理者
      ADMIN_PASSWORD: vibe-ci-dummy-admin-password-6666777788889999

    # 秘密漏えい検査はアプリを**実際に起動して**応答を見るので DB が要る。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: driving_school
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.agent.outputs.base }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: vibe-patch
          path: /tmp

      - name: 検査モジュールを base から退避する
        # ⚠️ **判定モジュールを作業ツリーから読んではいけない**（SEC-099）。
        # patch が判定モジュール自身を含んでいれば、検査はそろって「許可されている」と答える。
        run: |
          mkdir -p /tmp/vibe-guard
          git show "HEAD:scripts/check-protected-paths.mjs" > /tmp/vibe-guard/check-protected-paths.mjs
          git show "HEAD:scripts/vibe-policy.mjs"           > /tmp/vibe-guard/vibe-policy.mjs
          git show "HEAD:scripts/check-secret-leak.mjs"     > /tmp/vibe-guard/check-secret-leak.mjs

      - name: patch を当てて、もう一度検査する
        # ⚠️ **agent ジョブの検査を信用しない。** そのジョブではエージェントが動いていた。
        # ここは patch だけを受け取ったクリーンな木なので、判定を独立にやり直せる。
        run: |
          git apply --index --whitespace=nowarn /tmp/vibe.patch
          node /tmp/vibe-guard/check-protected-paths.mjs HEAD

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate

      - name: 型チェック
        run: pnpm type-check

      - name: 単体テスト
        run: pnpm test:unit

      - name: ビルド
        # ローカルと同じく DB 非依存（vercel-build ではなく build を使う）。
        run: pnpm build

      - name: マイグレーションと seed
        run: |
          pnpm exec prisma migrate deploy
          pnpm db:seed

      - name: 公開ページの応答に秘密が出ていないか**実測する**
        # ══════════════════════════════════════════════════════════════════
        # ⚠️ これが SEC-098 の**主防御**である。外さないこと。
        # ══════════════════════════════════════════════════════════════════
        # 静的な秘密検査（check-protected-paths.mjs）は「書き方」を探す拒否リストで、
        # 監査は 6 通り以上の迂回を示した。決定的だったのは `getServerEnv()` を呼ぶ部品を
        # components/ に新規作成し、既存ページから差し込む形——`process.env` の文字列が
        # どこにも現れず、許可パス検査・型・単体・ビルドの**4つすべてが緑のまま**通り、
        # 未認証の GET が AUTH_SECRET を返した。
        #
        # **書き方ではなく結果を見れば、迂回形を列挙する必要がない。**
        run: |
          pnpm start &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/; then break; fi
            if [ "$i" -eq 60 ]; then echo "サーバーが起動しませんでした"; exit 1; fi
            sleep 2
          done
          node /tmp/vibe-guard/check-secret-leak.mjs http://localhost:3000

  # ────────────────────────────────────────────────────────────────
  # 3. push: patch を当てて commit & push するだけ。
  #    **install も build もしない＝エージェントのコードを一切実行しない。**
  # ────────────────────────────────────────────────────────────────
  push:
    needs: [agent, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.agent.outputs.base }}
          # ここでも資格情報は残さない。push は下で明示的にトークンを渡す。
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: vibe-patch
          path: /tmp

      - name: 検査モジュールを base から退避する
        # ⚠️ **判定モジュールを作業ツリーから読んではいけない**（SEC-099）。
        # 3回の検査は「前のジョブを信用しない」ために置いているが、いずれも
        # `scripts/vibe-policy.mjs` を作業ツリーから読んでいた。patch がその判定モジュール
        # 自身を含んでいれば、3つの検査はそろって「許可されている」と答える。
        # base の内容をツリー外へ退避し、**常にそちらを実行する。**
        run: |
          mkdir -p /tmp/vibe-guard
          git show "HEAD:scripts/check-protected-paths.mjs" > /tmp/vibe-guard/check-protected-paths.mjs
          git show "HEAD:scripts/vibe-policy.mjs"           > /tmp/vibe-guard/vibe-policy.mjs

      - name: patch を当てて、三度目の検査をする
        run: |
          git apply --index --whitespace=nowarn /tmp/vibe.patch
          node /tmp/vibe-guard/check-protected-paths.mjs HEAD

      - name: コミットして push
        env:
          INSTRUCTION: ${{ inputs.instruction }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "Vibe Coding"
          git config user.email "noreply@users.noreply.github.com"
          git commit -m "style: ${INSTRUCTION}

          管理画面の Vibe Coding から生成。
          許可パス検査 / type-check / unit / build を通過。
          実行ログ: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:master
